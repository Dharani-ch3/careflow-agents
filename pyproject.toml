[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "careflow-agents"
version = "0.1.0"
description = "Stateful multi-agent workflows for healthcare service requests, with a verifier loop, human review and a custom MCP tool server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dharani Chalichama" }]
requires-python = ">=3.11"
keywords = ["langgraph", "mcp", "agents", "llm", "healthcare", "human-in-the-loop"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Typing :: Typed",
]
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "langchain-core>=1.0,<2",
  "mcp>=2.0,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
ollama = ["langchain-ollama>=1.0"]
encryption = ["pycryptodome>=3.20"]
all = ["careflow-agents[openai,anthropic,ollama,encryption]"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[project.scripts]
careflow = "careflow.cli:main"
careflow-mcp = "careflow.mcp_server:main"

[project.urls]
Repository = "https://github.com/Dharani-ch3/careflow-agents"
Portfolio = "https://dharanichalichama.netlify.app/"

[tool.hatch.build.targets.wheel]
packages = ["src/careflow"]

# ---------- tooling ----------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = [
  "S101",   # assert is fine in tests
  "S608",   # SQL is built from fixed fragments only, values are always bound
  "RUF001", # allow typographic characters in strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
# 3.12 because some transitive stubs (numpy) use 3.12 syntax; the 3.11 test job
# still guards runtime compatibility.
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
